# 采集程序清单
#
# 平台只往命令行末尾追加 --task <task.json>，采集程序把结果写到 task.json 里的 result_path。
# 每家银行一个独立项目，平台不猜任何路径：这里配了才能调，没配就报错提示怎么加。
#
# 契约：
#   - task.json   ：bank_code、账号、区间、工作目录、归档根目录、result_path、contract_version
#   - result.json ：contract_version / task_id / ok / error_code / message / no_data / files
#   - 退出码      ：0 成功，非 0 失败
#   - 密钥        ：不写进 task.json，由平台通过环境变量传入
#                   BANK_USERNAME / BANK_PASSWORD / BANK_PIN
#
# 开发机用源码跑（改完即生效），客户机换成编好的 exe，平台侧不用改。

# 工商银行（源码）
# icbc:
#   command: ["python", "run_task.py"]
#   cwd: C:\wangyingbao\工商银行\icbc_automation

# 工商银行（客户机，编译后）
# icbc:
#   command: ["D:\\collectors\\icbc\\icbc-collector.exe"]
#   cwd: D:\collectors\icbc
