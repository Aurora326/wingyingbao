<div class="stat-row five">
  <div class="stat">
    <span class="k">全部任务</span>
    <span class="v">{{ stats.total }}</span>
    <span class="f">历次流水与回单采集</span>
  </div>
  <div class="stat">
    <span class="k">进行中</span>
    <span class="v {{ 'amber' if stats.running else '' }}">{{ stats.running }}</span>
    <span class="f">等待或正在执行</span>
  </div>
  <div class="stat">
    <span class="k">已完成</span>
    <span class="v green">{{ stats.succeeded }}</span>
    <span class="f">数据已正常入库</span>
  </div>
  <div class="stat">
    <span class="k">需处理</span>
    <span class="v {{ 'red' if stats.failed else '' }}">{{ stats.failed }}</span>
    <span class="f">{% if stats.failed %}建议查看原因后重试{% else %}没有失败任务{% endif %}</span>
  </div>
  <div class="stat">
    <span class="k">已停止</span>
    <span class="v">{{ stats.cancelled }}</span>
    <span class="f">用户主动停止的采集</span>
  </div>
</div>
