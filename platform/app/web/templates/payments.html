{% extends "base.html" %}
{% block title %}付款协同 · 上海浦东地产司库系统{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">收付款</div>
    <h1>付款协同</h1>
  </div>
</div>

{% include "_payments_region.html" %}

<div class="modal" id="pay-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="pay-confirm-title">
  <div class="box form-box pay-action-box">
    <div class="head">
      <div>
        <strong id="pay-confirm-title">确认付款账户</strong>
        <div class="modal-sub" id="pay-confirm-subtitle"></div>
      </div>
      <button class="icon-btn" type="button" onclick="closeModal('pay-confirm-modal')" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <form method="post" id="pay-confirm-form">
      <div class="form-grid">
        <div class="field full">
          <label for="pay-confirm-payer-search">付款账户</label>
          <div class="combo">
            <input type="text" id="pay-confirm-payer-search" placeholder="搜索账户名、账号或银行" autocomplete="off"
                   onfocus="openCombo('confirm_payer')" oninput="filterCombo('confirm_payer')" onkeydown="comboKey(event, 'confirm_payer')">
            <input type="hidden" name="payer_account_id" id="pay-confirm-payer">
            <div class="combo-list" id="pay-confirm-payer-list" hidden></div>
          </div>
        </div>
        <div class="field full">
          <label for="pay-confirm-payee-search">收款账户</label>
          <div class="combo">
            <input type="text" id="pay-confirm-payee-search" placeholder="搜索收款单位、账号或开户行" autocomplete="off"
                   onfocus="openCombo('confirm_payee')" oninput="filterCombo('confirm_payee')" onkeydown="comboKey(event, 'confirm_payee')">
            <input type="hidden" name="payee_account_id" id="pay-confirm-payee">
            <div class="combo-list" id="pay-confirm-payee-list" hidden></div>
          </div>
        </div>
        <div class="field full">
          <label for="pay-confirm-reason">调整原因</label>
          <input id="pay-confirm-reason" type="text" name="reason" placeholder="与申请单不一致时填写，可选">
        </div>
      </div>
      <div class="form-note">确认后提交出纳审核。平台只生成制单草稿，银行侧复核与授权仍需在网银完成。</div>
      <div class="modal-foot">
        <button type="button" onclick="closeModal('pay-confirm-modal')">取消</button>
        <button type="submit" class="primary">确认并提交审核</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="pay-review-modal" role="dialog" aria-modal="true" aria-labelledby="pay-review-title">
  <div class="box form-box pay-action-box">
    <div class="head">
      <div>
        <strong id="pay-review-title">确认可制单</strong>
        <div class="modal-sub" id="pay-review-subtitle"></div>
      </div>
      <button class="icon-btn" type="button" onclick="closeModal('pay-review-modal')" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <form method="post" id="pay-review-form">
      <div class="field">
        <label for="pay-review-opinion">审核意见</label>
        <input id="pay-review-opinion" type="text" name="opinion" placeholder="退回时请填写原因">
      </div>
      <div class="form-note">确认可制单后，单据进入可制单队列；退回后由业务重新确认账户。</div>
      <div class="modal-foot">
        <button type="button" onclick="closeModal('pay-review-modal')">取消</button>
        <button type="submit" class="small" name="action" value="reject">退回</button>
        <button type="submit" class="primary" name="action" value="approve">确认可制单</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="pay-edit-modal" role="dialog" aria-modal="true" aria-labelledby="pay-edit-title">
  <div class="box form-box pay-action-box pay-edit-box">
    <div class="head">
      <div>
        <strong id="pay-edit-title">编辑付款单据</strong>
        <div class="modal-sub" id="pay-edit-subtitle"></div>
      </div>
      <button class="icon-btn" type="button" onclick="closeModal('pay-edit-modal')" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <form method="post" id="pay-edit-form">
      <div class="form-grid">
        <div class="field"><label for="pay-edit-apply-no">申请编号</label><input id="pay-edit-apply-no" name="apply_no" required></div>
        <div class="field"><label for="pay-edit-date">申请日期</label><input id="pay-edit-date" type="text" data-datepicker name="apply_date"></div>
        <div class="field full"><label for="pay-edit-subject">申请主题</label><input id="pay-edit-subject" name="subject"></div>
        <div class="field"><label for="pay-edit-applicant">申请人</label><input id="pay-edit-applicant" name="applicant"></div>
        <div class="field"><label for="pay-edit-department">申请部门</label><input id="pay-edit-department" name="department"></div>
        <div class="field"><label for="pay-edit-approval-type">付款审批类型</label><input id="pay-edit-approval-type" name="approval_type"></div>
        <div class="field"><label for="pay-edit-currency">币种</label><input id="pay-edit-currency" name="currency"></div>
        <div class="field full">
          <label for="pay-edit-payee-search">收款方（基础资料）</label>
          <div class="combo">
            <input type="text" id="pay-edit-payee-search" placeholder="搜索收款单位、账号或开户行" autocomplete="off"
                   onfocus="openCombo('payee')" oninput="filterCombo('payee')" onkeydown="comboKey(event, 'payee')">
            <input type="hidden" name="payee_account_id" id="pay-edit-payee-id">
            <div class="combo-list" id="pay-edit-payee-list" hidden></div>
          </div>
        </div>
        <div class="field full">
          <label for="pay-edit-payer-search">付款方（基础资料）</label>
          <div class="combo">
            <input type="text" id="pay-edit-payer-search" placeholder="搜索账户名、账号或银行" autocomplete="off"
                   onfocus="openCombo('payer')" oninput="filterCombo('payer')" onkeydown="comboKey(event, 'payer')">
            <input type="hidden" name="payer_account_id" id="pay-edit-payer-id">
            <div class="combo-list" id="pay-edit-payer-list" hidden></div>
          </div>
        </div>
        <div class="field full" id="pay-edit-sub-field" hidden>
          <label for="pay-edit-sub-search">付款子账簿（农行多级账簿）</label>
          <div class="combo">
            <input type="text" id="pay-edit-sub-search" placeholder="按项目名称或账簿号搜索" autocomplete="off"
                   onfocus="openSubCombo()" oninput="filterSubCombo()">
            <input type="hidden" name="payer_sub_account_id" id="pay-edit-sub-id">
            <div class="combo-list" id="pay-edit-sub-list" hidden></div>
          </div>
        </div>
        <div class="field"><label for="pay-edit-payee-name">收款单位</label><input id="pay-edit-payee-name" name="payee_name"></div>
        <div class="field"><label for="pay-edit-payee-account">收款账号</label><input id="pay-edit-payee-account" name="payee_account_no"></div>
        <div class="field"><label for="pay-edit-payee-bank">收款开户行</label><input id="pay-edit-payee-bank" name="payee_bank"></div>
        <div class="field"><label for="pay-edit-payee-branch">收款支行</label><input id="pay-edit-payee-branch" name="payee_branch"></div>
        <div class="field"><label for="pay-edit-payer-name">付款单位</label><input id="pay-edit-payer-name" name="payer_name"></div>
        <div class="field"><label for="pay-edit-payer-account">付款账号</label><input id="pay-edit-payer-account" name="payer_account_no"></div>
        <div class="field"><label for="pay-edit-payer-bank">付款开户行</label><input id="pay-edit-payer-bank" name="payer_bank"></div>
        <div class="field"><label for="pay-edit-amount">申请金额</label><input id="pay-edit-amount" type="number" step="0.01" name="amount" required></div>
        <div class="field"><label for="pay-edit-paid">实付金额</label><input id="pay-edit-paid" type="number" step="0.01" name="paid_amount"></div>
        <div class="field full"><label for="pay-edit-project">项目信息</label><input id="pay-edit-project" name="project_name"></div>
        <div class="field full"><label for="pay-edit-contract-name">合同名称</label><input id="pay-edit-contract-name" name="contract_name"></div>
        <div class="field"><label for="pay-edit-contract-no">合同编号</label><input id="pay-edit-contract-no" name="contract_no"></div>
        <div class="field"><label for="pay-edit-approval-status">审批状态</label><input id="pay-edit-approval-status" name="approval_status"></div>
        <div class="field"><label for="pay-edit-node">当前节点</label><input id="pay-edit-node" name="approval_node"></div>
        <div class="field"><label for="pay-edit-handler">当前处理人</label><input id="pay-edit-handler" name="approval_handler"></div>
        <div class="field"><label for="pay-edit-status">单据状态</label>
          <select id="pay-edit-status" name="status">
            {% for key in status_order %}<option value="{{ key }}">{{ status_labels.get(key, key) }}</option>{% endfor %}
          </select>
        </div>
        <div class="field full"><label for="pay-edit-description">说明</label><textarea id="pay-edit-description" name="description" rows="3"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeModal('pay-edit-modal')">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="pay-draft-modal" role="dialog" aria-modal="true" aria-labelledby="pay-draft-title">
  <div class="box form-box pay-action-box">
    <div class="head">
      <div>
        <strong id="pay-draft-title">发起制单</strong>
        <div class="modal-sub">按付款账户拆分，每个账户生成一份批量文件</div>
      </div>
      <button class="icon-btn" type="button" onclick="closeModal('pay-draft-modal')" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <div id="pay-draft-body" class="draft-body"></div>
    <div class="modal-foot">
      <button type="button" onclick="closeModal('pay-draft-modal')">取消</button>
      <button class="primary" type="button" id="pay-draft-confirm" onclick="confirmDraft()" disabled>确认制单</button>
    </div>
  </div>
</div>

<script>
  window.__PAYEE_DATA = {{ payee_data | tojson }};
  window.__PAYER_DATA = {{ payer_data | tojson }};
  window.__BANK_OPTIONS = {{ bank_options | tojson }};
  window.__SUB_DATA = {{ sub_data | tojson }};

  const COMBO_CFG = {
    payee: {data: window.__PAYEE_DATA, input: 'pay-edit-payee-search', list: 'pay-edit-payee-list', hidden: 'pay-edit-payee-id',
            fields: {name: 'pay-edit-payee-name', account: 'pay-edit-payee-account', bank: 'pay-edit-payee-bank', branch: 'pay-edit-payee-branch'}},
    payer: {data: window.__PAYER_DATA, input: 'pay-edit-payer-search', list: 'pay-edit-payer-list', hidden: 'pay-edit-payer-id',
            fields: {name: 'pay-edit-payer-name', account: 'pay-edit-payer-account', bank: 'pay-edit-payer-bank'}},
    confirm_payer: {data: window.__PAYER_DATA, input: 'pay-confirm-payer-search', list: 'pay-confirm-payer-list', hidden: 'pay-confirm-payer'},
    confirm_payee: {data: window.__PAYEE_DATA, input: 'pay-confirm-payee-search', list: 'pay-confirm-payee-list', hidden: 'pay-confirm-payee'},
  };

  function escapeCombo(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));
  }

  function comboLabel(item) {
    const prefix = item.status && item.status !== 'active' ? '（停用）' : '';
    return `${prefix}${item.name || '未命名'} · ${item.account || '无账号'} · ${item.bank || '—'}`;
  }

  function renderCombo(kind, keyword) {
    const cfg = COMBO_CFG[kind];
    const list = document.getElementById(cfg.list);
    if (!cfg || !list) return;
    const kw = String(keyword || '').trim().toLowerCase();
    const items = cfg.data.filter((item) => {
      if (!kw) return true;
      return `${item.name} ${item.account} ${item.bank}`.toLowerCase().includes(kw);
    }).slice(0, 50);
    list.innerHTML = items.length
      ? items.map((item) => `<button type="button" class="combo-item" data-id="${item.id}" onmousedown="pickCombo('${kind}', ${item.id})">${escapeCombo(comboLabel(item))}</button>`).join('')
      : `<div class="combo-empty">没有匹配的账户</div>
         <button type="button" class="combo-add" onmousedown="openComboAdd('${kind}')">+ 新增${kind.includes('payee') ? '收款' : '付款'}账户</button>`;
    list.hidden = false;
  }

  function openCombo(kind) { renderCombo(kind, ''); }

  function filterCombo(kind) {
    const cfg = COMBO_CFG[kind];
    const input = document.getElementById(cfg.input);
    const hidden = document.getElementById(cfg.hidden);
    if (hidden && hidden.value) {
      const current = cfg.data.find((entry) => String(entry.id) === String(hidden.value));
      const label = current ? `${current.name} · ${current.account}` : '';
      if (!label || input.value !== label) {
        hidden.value = '';
        if (kind === 'payer') syncSubField(null);
        if (cfg.fields) {
          Object.values(cfg.fields).forEach((fieldId) => {
            const field = document.getElementById(fieldId);
            if (field) field.readOnly = false;
          });
        }
      }
    }
    renderCombo(kind, input.value);
  }

  function pickCombo(kind, id) {
    const cfg = COMBO_CFG[kind];
    const item = cfg.data.find((entry) => String(entry.id) === String(id));
    if (!item) return;
    const hidden = document.getElementById(cfg.hidden);
    if (hidden) hidden.value = item.id;
    const input = document.getElementById(cfg.input);
    if (input) input.value = `${item.name} · ${item.account}`;
    if (cfg.fields) {
      const values = {name: item.name, account: item.account, bank: item.bank, branch: item.branch};
      Object.entries(cfg.fields).forEach(([key, fieldId]) => {
        const field = document.getElementById(fieldId);
        if (field) { field.value = values[key] || ''; field.readOnly = true; }
      });
    }
    const list = document.getElementById(cfg.list);
    if (list) list.hidden = true;
    if (kind === 'payer') syncSubField(item.id);
  }

  function payerItem(id) {
    return (window.__PAYER_DATA || []).find((entry) => String(entry.id) === String(id));
  }

  function payerSubs(id) {
    return (window.__SUB_DATA || []).filter((entry) => String(entry.parent_id) === String(id));
  }

  function syncSubField(payerId) {
    const field = document.getElementById('pay-edit-sub-field');
    const input = document.getElementById('pay-edit-sub-search');
    const hidden = document.getElementById('pay-edit-sub-id');
    if (!field || !input || !hidden) return;
    const subs = payerId ? payerSubs(payerId) : [];
    if (!subs.length) {
      field.hidden = true;
      input.value = '';
      hidden.value = '';
      return;
    }
    field.hidden = false;
    if (hidden.value && !subs.some((sub) => String(sub.id) === String(hidden.value))) {
      hidden.value = '';
      input.value = '';
    }
  }

  function renderSubCombo(keyword) {
    const list = document.getElementById('pay-edit-sub-list');
    if (!list) return;
    const payerId = document.getElementById('pay-edit-payer-id').value;
    const kw = String(keyword || '').trim().toLowerCase();
    const subs = payerSubs(payerId)
      .filter((sub) => !kw || `${sub.name} ${sub.sub_no}`.toLowerCase().includes(kw))
      .slice(0, 50);
    list.innerHTML = subs.length
      ? subs.map((sub) => `<button type="button" class="combo-item" onmousedown="pickSub(${sub.id})">${escapeCombo(sub.name)} · ${escapeCombo(sub.sub_no)}</button>`).join('')
      : '<div class="combo-empty">没有匹配的子账簿</div>';
    list.hidden = false;
  }

  function openSubCombo() { renderSubCombo(''); }
  function filterSubCombo() { renderSubCombo(document.getElementById('pay-edit-sub-search').value); }

  function pickSub(id) {
    const sub = (window.__SUB_DATA || []).find((entry) => String(entry.id) === String(id));
    if (!sub) return;
    const payer = payerItem(sub.parent_id);
    if (!payer) return;
    document.getElementById('pay-edit-sub-id').value = sub.id;
    document.getElementById('pay-edit-sub-search').value = `${sub.name} · ${sub.sub_no}`;
    document.getElementById('pay-edit-payer-account').value = `${payer.account}-${sub.sub_no}`;
    document.getElementById('pay-edit-sub-list').hidden = true;
  }

  function clearCombo(kind) {
    const cfg = COMBO_CFG[kind];
    const hidden = document.getElementById(cfg.hidden);
    if (hidden) hidden.value = '';
    const input = document.getElementById(cfg.input);
    if (input) input.value = '';
    if (cfg.fields) {
      Object.values(cfg.fields).forEach((fieldId) => {
        const field = document.getElementById(fieldId);
        if (field) field.readOnly = false;
      });
    }
    if (kind === 'payer') syncSubField(null);
  }

  function openComboAdd(kind) {
    const cfg = COMBO_CFG[kind];
    const list = document.getElementById(cfg.list);
    const isPayee = kind.includes('payee');
    const bankField = isPayee
      ? `<input id="combo-add-${kind}-bank" placeholder="开户行">`
      : `<select id="combo-add-${kind}-bank-code">${window.__BANK_OPTIONS.map((bank) => `<option value="${bank.code}">${escapeCombo(bank.name)}</option>`).join('')}</select>`;
    const branchField = isPayee ? `<input id="combo-add-${kind}-branch" placeholder="开户支行（可选）">` : '';
    list.innerHTML = `
      <div class="combo-form">
        <div class="combo-form-title">新增${isPayee ? '收款' : '付款'}账户</div>
        <input id="combo-add-${kind}-name" placeholder="名称">
        <input id="combo-add-${kind}-account" placeholder="账号">
        ${bankField}
        ${branchField}
        <div class="combo-form-actions">
          <button type="button" class="small primary" onmousedown="submitComboAdd('${kind}')">保存并选中</button>
          <button type="button" class="small" onmousedown="openCombo('${kind}')">取消</button>
        </div>
        <div class="combo-form-error" id="combo-add-${kind}-error"></div>
      </div>`;
    list.hidden = false;
    const nameInput = document.getElementById(`combo-add-${kind}-name`);
    if (nameInput) nameInput.focus();
  }

  async function submitComboAdd(kind) {
    const cfg = COMBO_CFG[kind];
    const isPayee = kind.includes('payee');
    const name = document.getElementById(`combo-add-${kind}-name`).value.trim();
    const accountNo = document.getElementById(`combo-add-${kind}-account`).value.trim();
    const errorBox = document.getElementById(`combo-add-${kind}-error`);
    const params = new URLSearchParams({name, account_no: accountNo});
    if (isPayee) {
      params.set('bank', document.getElementById(`combo-add-${kind}-bank`).value.trim());
      params.set('branch', document.getElementById(`combo-add-${kind}-branch`).value.trim());
    } else {
      params.set('bank_code', document.getElementById(`combo-add-${kind}-bank-code`).value);
    }
    try {
      const resp = await fetch(isPayee ? '/payments/accounts/quick-payee' : '/payments/accounts/quick-payer', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: params,
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
      const item = data.item;
      if (!cfg.data.some((entry) => String(entry.id) === String(item.id))) cfg.data.push(item);
      pickCombo(kind, item.id);
      if (data.existing) {
        // 已存在时直接选中，不重复创建
      }
    } catch (err) {
      if (errorBox) errorBox.textContent = err.message;
    }
  }

  function setComboValue(kind, id, accountNo, fallbackName) {    const cfg = COMBO_CFG[kind];
    let item = id ? cfg.data.find((entry) => String(entry.id) === String(id)) : null;
    if (!item && accountNo) item = cfg.data.find((entry) => entry.account === accountNo);
    if (item) { pickCombo(kind, item.id); return; }
    clearCombo(kind);
    if (fallbackName) document.getElementById(cfg.input).value = fallbackName;
  }

  function comboKey(event, kind) {
    const cfg = COMBO_CFG[kind];
    const list = document.getElementById(cfg.list);
    if (!list || list.hidden) { if (event.key === 'ArrowDown') renderCombo(kind, ''); return; }
    const items = Array.from(list.querySelectorAll('.combo-item'));
    if (!items.length) return;
    let index = items.findIndex((item) => item.classList.contains('active'));
    if (event.key === 'ArrowDown') { event.preventDefault(); index = Math.min(items.length - 1, index + 1); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); index = Math.max(0, index - 1); }
    else if (event.key === 'Enter') { event.preventDefault(); (items[index] || items[0]).dispatchEvent(new MouseEvent('mousedown')); return; }
    else if (event.key === 'Escape') { list.hidden = true; return; }
    else return;
    items.forEach((item) => item.classList.remove('active'));
    items[index].classList.add('active');
    items[index].scrollIntoView({block: 'nearest'});
  }

  document.addEventListener('click', (event) => {
    document.querySelectorAll('.combo-list').forEach((list) => {
      if (!list.parentElement.contains(event.target)) list.hidden = true;
    });
  });

  function openPayConfirm(button) {
    const form = document.getElementById('pay-confirm-form');
    if (!form) return;
    form.reset();
    form.action = `/payments/${button.dataset.doc}/confirm`;
    document.getElementById('pay-confirm-subtitle').textContent =
      button.dataset.apply ? `单据 ${button.dataset.apply}` : '';
    setComboValue('confirm_payer', null, button.dataset.payer, '');
    setComboValue('confirm_payee', null, button.dataset.payee, '');
    openModal('pay-confirm-modal', '#pay-confirm-payer-search');
  }

  function openPayReview(button) {
    const form = document.getElementById('pay-review-form');
    if (!form) return;
    form.reset();
    form.action = `/payments/${button.dataset.doc}/review`;
    document.getElementById('pay-review-subtitle').textContent =
      button.dataset.apply ? `单据 ${button.dataset.apply}` : '';
    openModal('pay-review-modal', '#pay-review-opinion');
  }

  async function openPayEdit(button) {
    const id = button.dataset.doc;
    const form = document.getElementById('pay-edit-form');
    if (!form) return;
    try {
      const resp = await fetch(`/api/payment/docs/${id}`, {headers: {'Accept': 'application/json'}});
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const doc = await resp.json();
      form.action = `/payments/${id}/edit`;
      document.getElementById('pay-edit-subtitle').textContent = doc.apply_no || '';
      for (const [name, val] of Object.entries(doc)) {
        const field = form.elements.namedItem(name);
        if (field && 'value' in field) field.value = val == null ? '' : val;
      }
      setComboValue('payee', doc.payee_account_id, doc.payee_account_no, doc.payee_name);
      setComboValue('payer', doc.payer_account_id, doc.payer_account_no, doc.payer_name);
      if (doc.payer_sub_account_id) {
        pickSub(doc.payer_sub_account_id);
      }
      openModal('pay-edit-modal', '#pay-edit-apply-no');
    } catch (err) {
      alert(`加载单据失败：${err.message}`);
    }
  }

  (function () {
    const form = document.getElementById('pay-edit-form');
    if (!form) return;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const data = new FormData(form);
      data.set('next', location.pathname + location.search);
      if (submitBtn) submitBtn.disabled = true;
      try {
        const resp = await fetch(form.action, {method: 'POST', body: data});
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const html = await resp.text();
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        const nextPanel = parsed.querySelector('.pay-panel');
        const currentPanel = document.querySelector('.pay-panel');
        if (nextPanel && currentPanel) currentPanel.replaceWith(nextPanel);
        closeModal('pay-edit-modal');
      } catch (err) {
        alert(`保存失败：${err.message}`);
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  })();
  function pickedDocs() {
    return Array.from(document.querySelectorAll('.pay-pick:checked')).map((el) => el.value);
  }

  function updatePickCount() {
    const count = pickedDocs().length;
    const label = document.getElementById('pay-picked-count');
    const btn = document.getElementById('pay-draft-btn');
    if (label) label.textContent = count ? `已选 ${count} 笔` : '未选择单据';
    if (btn) btn.disabled = count === 0;
    const all = document.getElementById('pay-pick-all');
    if (all) {
      const boxes = Array.from(document.querySelectorAll('.pay-pick'));
      all.checked = boxes.length > 0 && boxes.every((box) => box.checked);
    }
  }

  function toggleAllDocs(box) {
    document.querySelectorAll('.pay-pick').forEach((el) => { el.checked = box.checked; });
    updatePickCount();
  }

  function draftMoney(value) {
    return '¥' + Number(value || 0).toLocaleString('zh-CN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function draftEscape(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function openDraftPreview() {
    const ids = pickedDocs();
    if (!ids.length) return;
    const body = document.getElementById('pay-draft-body');
    const confirm = document.getElementById('pay-draft-confirm');
    body.innerHTML = '<p class="muted">正在整理…</p>';
    confirm.disabled = true;
    openModal('pay-draft-modal');
    const data = new FormData();
    ids.forEach((id) => data.append('doc_ids', id));
    try {
      const resp = await fetch('/payments/drafts/preview', {method: 'POST', body: data});
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.detail || '预览失败');
      window.__DRAFT_PICK = result.doc_ids || [];
      let html = `<div class="draft-sum">本次制单 <b>${result.count}</b> 笔，合计 <b>${draftMoney(result.amount)}</b></div>`;
      html += '<div class="draft-groups">';
      result.groups.forEach((g) => {
        html += `<div class="draft-group">
          <span class="draft-account">${draftEscape(g.account_name || g.account_no)}</span>
          <span class="mono muted">${draftEscape(g.account_no)}</span>
          <span class="muted">${g.count} 笔</span>
          <b>${draftMoney(g.amount)}</b>
        </div>`;
      });
      html += '</div>';
      if (result.problems && result.problems.length) {
        html += `<div class="draft-problems"><b>${result.problems.length} 条不能制单，将被跳过：</b>`;
        result.problems.slice(0, 10).forEach((p) => {
          html += `<div class="cell-sub danger">${draftEscape(p.apply_no || '#' + p.id)}：${draftEscape(p.reason)}</div>`;
        });
        html += '</div>';
      }
      body.innerHTML = html;
      confirm.disabled = !result.count;
      confirm.textContent = result.count ? `确认制单 ${result.count} 笔` : '确认制单';
    } catch (err) {
      body.innerHTML = `<p class="danger">${draftEscape(err.message)}</p>`;
    }
  }

  async function confirmDraft() {
    const ids = window.__DRAFT_PICK || [];
    if (!ids.length) return;
    const btn = document.getElementById('pay-draft-confirm');
    btn.disabled = true;
    const data = new FormData();
    ids.forEach((id) => data.append('doc_ids', id));
    try {
      const resp = await fetch('/payments/drafts', {method: 'POST', body: data});
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.detail || '制单失败');
      window.location.href = result.redirect;
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  }
</script>
