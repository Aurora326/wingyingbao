<!doctype html>
{% set asset_v = asset_version() %}
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 上海浦东地产司库系统</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body class="login-page">
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m4 4 16 16"/><path d="M9.9 5.9a9.6 9.6 0 0 1 2.1-.4c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4"/><path d="M6.3 7.8A16.6 16.6 0 0 0 2.5 12s3.5 6.5 9.5 6.5a9.4 9.4 0 0 0 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.1 8.3-7.5 9.5-4.4-1.2-7.5-4.9-7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></symbol>
</svg>

<svg class="login-flow" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <g class="flow-lines">
    <path class="l1" d="M-60 180C260 150 430 330 700 300S1150 430 1660 380"/>
    <path class="l2" d="M-60 300C300 280 500 480 780 450S1200 600 1660 540"/>
    <path class="l3" d="M-60 470C280 460 520 680 820 660S1240 800 1660 740"/>
    <path class="flow-pulse" d="M-60 300C300 280 500 480 780 450S1200 600 1660 540"/>
  </g>
  <g class="flow-dots">
    <circle cx="384" cy="292" r="2.4"/>
    <circle cx="698" cy="452" r="2"/>
    <circle cx="1050" cy="520" r="2.6"/>
    <circle cx="1310" cy="596" r="1.8"/>
  </g>
</svg>

<div class="login-wrap">
  <section class="login-brand">
    <div class="login-top">
      <div class="login-logo">
        <svg class="login-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#22303F"/>
          <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="#b98a44" stroke-opacity=".72"/>
          <path d="M9.5 21.5v-5M14.5 21.5v-9M19.5 21.5v-6M24.5 21.5v-11" stroke="#f0e2c4" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 25h16" stroke="#b98a44" stroke-width="1" stroke-linecap="round" opacity=".8"/>
        </svg>
        <span class="login-name">上海浦东地产司库系统</span>
      </div>
      <div class="login-en">PUDONG REAL ESTATE TREASURY</div>
    </div>

    <div class="login-copy">
      <div class="rule"></div>
      <h2>把集团每一家公司的账，<br>放在一个地方看清楚</h2>
      <p>让每一笔资金的来去，都有据可查。</p>
    </div>

    <div class="login-foot">© 2026 上海浦东地产 · 内部系统，仅限授权人员访问</div>
  </section>

  <section class="login-side">
    <form class="login-card" method="post" action="/login">
      <div class="login-card-head">
        <svg class="login-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#22303F"/>
          <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="#b98a44" stroke-opacity=".72"/>
          <path d="M9.5 21.5v-5M14.5 21.5v-9M19.5 21.5v-6M24.5 21.5v-11" stroke="#f0e2c4" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 25h16" stroke="#b98a44" stroke-width="1" stroke-linecap="round" opacity=".8"/>
        </svg>
        <div class="login-title">上海浦东地产司库系统</div>
        <div class="login-divider"><span>欢迎使用</span></div>
      </div>

      {% if error %}<div class="error">{{ error }}</div>{% endif %}

      <div class="field">
        <label for="login-username">账号</label>
        <div class="login-input">
          <svg class="ico"><use href="#i-user"/></svg>
          <input id="login-username" name="username" autocomplete="username" placeholder="请输入账号" required autofocus>
        </div>
      </div>
      <div class="field">
        <label for="login-password">密码</label>
        <div class="login-input">
          <svg class="ico"><use href="#i-lock"/></svg>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button class="password-toggle" type="button" onclick="togglePassword('login-password', this)" aria-label="显示密码" title="显示密码">
            <svg class="ico"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button class="login-submit" type="submit">登录</button>
      <div class="login-note">
        <svg class="ico"><use href="#i-shield"/></svg>登录行为会记录在操作日志中
      </div>
    </form>
  </section>
</div>
<script src="/static/ui.js?v={{ asset_v }}"></script>
</body>
</html>
